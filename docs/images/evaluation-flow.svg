<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title description">
<title id="title">CardioTwin offline evaluation: grouped learning to whole-stream scoring</title><desc id="description">Data and offline labels undergo cohort audit and patient-group splits, then separate fitting, calibration and policy selection. The artifact is frozen before complete chronological replay and one-to-one event scoring. Future labels never enter runtime.</desc>
