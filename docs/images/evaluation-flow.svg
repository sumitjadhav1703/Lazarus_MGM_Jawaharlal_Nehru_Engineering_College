<style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#172b43} .heading{font-size:21px;font-weight:700} .body{font-size:18px}</style>
<rect width="960" height="370" rx="18" fill="#f6f8fa"/>
<path d="M290 105 H347" fill="none" stroke="#63758b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 105 H647" fill="none" stroke="#63758b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 160 V217" fill="none" stroke="#63758b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M650 275 H603" fill="none" stroke="#63758b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="50" width="250" height="110" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="165" y="84" class="heading">Data + offline labels</text><text x="165" y="112" class="body">Retrospective recordings</text><rect x="350" y="50" width="250" height="110" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="475" y="84" class="heading">Cohort audit</text><text x="475" y="112" class="body">Patient-group separation</text><rect x="650" y="50" width="250" height="110" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="775" y="84" class="heading">Grouped learning</text><text x="775" y="112" class="body">Separate fit, calibration</text><text x="775" y="135" class="body">and warning-policy roles</text><rect x="650" y="220" width="250" height="110" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="775" y="254" class="heading">Freeze artifact</text><text x="775" y="282" class="body">Manifest + checksums</text><rect x="350" y="220" width="250" height="110" rx="14" fill="#edf9f3" stroke="#1a7f64" stroke-width="2"/><text x="475" y="254" class="heading">Replay + scoring</text><text x="475" y="282" class="body">Complete timelines</text><text x="475" y="305" class="body">One-to-one event matching</text>
