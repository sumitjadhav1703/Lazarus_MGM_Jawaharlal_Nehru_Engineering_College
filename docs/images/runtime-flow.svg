<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description">
<title id="title">CardioTwin runtime: historical inputs to saved review</title><desc id="description">Previous 600 seconds of ECG and paired age/sex feed causal features and the frozen scorer. Warning policy saves per-patient state in SQLite, exposed through FastAPI and React. Baseline is context, not a frozen-model input.</desc>
