[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardiotwin"
version = "0.1.0"
description = "Research AF forecast digital twin with causal historical ECG replay"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "pandas>=2.2,<3", "wfdb>=4.2,<5", "scikit-learn>=1.8,<2", "xgboost>=3.0,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "joblib>=1.4,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
research = ["h5py>=3.14,<4"]
neural = ["torch>=2.6,<3"]
[project.scripts]
cardiotwin = "cardiotwin.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.hatch.build.targets.wheel]
packages = ["src/cardiotwin"]
[tool.hatch.build.targets.wheel.force-include]
"configs/default.json" = "cardiotwin/default.json"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
